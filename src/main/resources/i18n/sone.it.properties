Page.Rescue.Title=Recupera Sone - Sone
Page.Rescue.Page.Title=Recupera Sone «{0}»
Page.Rescue.Text.Description=La modalità di recupero ti permette di ripristinare versioni precedenti del tuo Sone. Questo può essere necessario se la tua configurazione è andata persa.
Page.Rescue.Text.Procedure=La modalità di recupero funziona scaricando l’ultima edizione inserita del tuo Sone. Se un’edizione viene scaricata con successo, verrà caricata nel tuo Sone, permettendoti di controllare i tuoi messaggi, il profilo e altre impostazioni (puoi farlo in una seconda scheda o finestra del browser). Se l’edizione scaricata non è quella che vuoi ripristinare, indica alla modalità di recupero di scaricare la successiva edizione più vecchia qui sotto.
Page.Rescue.Text.Fetching=Il recuperatore di Sone sta attualmente scaricando l’edizione {0} del tuo Sone.
Page.Rescue.Text.Fetched=Il recuperatore di Sone ha scaricato l’edizione {0} del tuo Sone. Controlla i tuoi messaggi, le risposte e il profilo. Se il contenuto attuale del Sone ti soddisfa, sbloccalo.
Page.Rescue.Text.FetchedLast=Il recuperatore di Sone ha scaricato l’ultima edizione disponibile. Se non è riuscito a ripristinare il tuo Sone, probabilmente ora non c’è più nulla da fare.
Page.Rescue.Text.NotFetched=Il recuperatore di Sone non è riuscito a scaricare l’edizione {0} del tuo Sone. Prova di nuovo con l’edizione {0} oppure passa alla successiva edizione più vecchia.

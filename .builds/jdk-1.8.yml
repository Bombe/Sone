image: alpine/edge
packages:
  - openjdk8
sources: 
  - https://git.sr.ht/~bombe/sone
tasks:
  - clean: |
      cd sone
      ./gradlew clean
  - build: |
      cd sone
      ./gradlew classes
  - test: |
      cd sone
      ./gradlew test
  - jar: |
      cd sone
      ./gradlew fatJar
artifacts:
  - ./sone/build/libs/sone-jar-with-dependencies.jar
